name: SeekDB migration lock diagnostics

on:
  pull_request:
    paths:
      - scripts/probe_seekdb_migration_lock.py
      - .github/workflows/seekdb-lock-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekdb-lock-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'
      - name: Reproduce migration lifecycle with complete native evidence
        run: uv run --locked --extra seekdb python scripts/probe_seekdb_migration_lock.py --attempts 12
      - name: Upload native logs, lifecycle and live transaction snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seekdb-lock-probe-${{ github.sha }}
          path: .powercontext/seekdb-lock-probe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
